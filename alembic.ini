[alembic]
script_location = database/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite+aiosqlite:///./data/autotrade.db
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
